<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#073b63"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Little Shark: Ocean Quest</title><link rel="stylesheet" href="style.css?v=shark-controls-2"></head>
<body><main id="app">
  <canvas id="game" width="960" height="540" aria-label="Little Shark Ocean Quest side-scrolling arcade game"></canvas>
  <div id="hud"><span id="world">WORLD 1 · LEVEL 1</span><span id="pearls">🟡 0</span><span id="hearts">❤️❤️❤️</span><span id="best">BEST 0</span></div>
  <div id="top"><button id="sound" aria-label="Toggle sound">🔊</button><button id="fullscreen" aria-label="Fullscreen">⛶</button><button id="pause" aria-label="Pause">Ⅱ</button></div>
  <div id="controls"><div id="move-pad"><button data-action="left" class="control left" aria-label="Swim left">◀</button><button data-action="down" class="control down" aria-label="Swim down">▼</button><button data-action="right" class="control right" aria-label="Swim right">▶</button></div><div id="main-actions"><button data-action="up" class="control up-left" aria-label="Swim up (left button)">▲</button><button id="dash" data-action="dash" aria-label="Dash through octopuses">DASH ⚡</button><button data-action="up" class="control up-right" aria-label="Swim up (right button)">▲</button></div></div>
  <div id="overlay"><section id="panel"><div class="eyebrow">🐚 UNDERWATER ADVENTURE</div><h1 id="title">Little Shark: Ocean Quest</h1><p id="description">Swim across 3 ocean worlds, collect golden pearls, dodge octopuses, and reach the glowing reef gate!</p><div id="worldselect"></div><p class="hint" id="hint">Use arrow keys / WASD to swim. Press Space for a dash. On phones, hold the touch arrows to steer.</p><button id="primary">LET'S SWIM!</button></section></div>
  <div id="toast" aria-live="polite"></div>
</main><script src="game.js?v=shark-controls-2"></script></body></html>
